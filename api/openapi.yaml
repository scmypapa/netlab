openapi: 3.0.3
info: {title: Netlab API, version: 1.0.0}
servers: [{url: /api/v1}]
security: [{bearer: []}]
paths:
  /environments:
    get:
      operationId: listEnvironments
      parameters: [{$ref: '#/components/parameters/Cursor'}, {$ref: '#/components/parameters/Limit'}, {$ref: '#/components/parameters/Search'}, {name: status, in: query, schema: {$ref: '#/components/schemas/EnvironmentStatus'}}]
      responses:
        '200': {description: Environment summaries, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/EnvironmentSummary'}}}}}
    post:
      operationId: createEnvironment
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CreateEnvironment'}}}}
      responses:
        '201': {description: Created, content: {application/json: {schema: {$ref: '#/components/schemas/Environment'}}}}
  /environments/{id}:
    parameters: [{$ref: '#/components/parameters/Id'}]
    get:
      operationId: getEnvironment
      responses:
        '200': {description: Environment, content: {application/json: {schema: {$ref: '#/components/schemas/Environment'}}}}
  /environments/{id}/state:
    parameters: [{$ref: '#/components/parameters/Id'}]
    get:
      operationId: getEnvironmentState
      responses:
        '200': {description: State, content: {application/json: {schema: {$ref: '#/components/schemas/EnvironmentState'}}}}
  /environments/{id}/events:
    parameters: [{$ref: '#/components/parameters/Id'}]
    get:
      operationId: environmentEvents
      parameters: [{name: Last-Event-ID, in: header, schema: {type: integer, format: int64}}]
      responses:
        '200': {description: Committed environment events, content: {text/event-stream: {schema: {type: string}}}}
  /environments/{id}/actions:
    parameters: [{$ref: '#/components/parameters/Id'}]
    post:
      operationId: environmentAction
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ActionRequest'}}}}
      responses: {'202': {$ref: '#/components/responses/Accepted'}}
  /environments/{id}/changes:
    parameters: [{$ref: '#/components/parameters/Id'}]
    post:
      operationId: changeEnvironment
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ChangeRequest'}}}}
      responses:
        '200': {description: Preview, content: {application/json: {schema: {$ref: '#/components/schemas/ChangePreview'}}}}
        '202': {$ref: '#/components/responses/Accepted'}
  /environments/{id}/view:
    parameters: [{$ref: '#/components/parameters/Id'}]
    put:
      operationId: saveView
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CanvasView'}}}}
      responses: {'204': {description: Saved}}
  /environments/{id}/draft:
    parameters: [{$ref: '#/components/parameters/Id'}]
    put:
      operationId: saveDraft
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/Draft'}}}}
      responses: {'204': {description: Saved}}
    delete:
      operationId: discardDraft
      responses: {'204': {description: Discarded}}
  /environments/{id}/blueprints:
    parameters: [{$ref: '#/components/parameters/Id'}]
    post:
      operationId: saveEnvironmentBlueprint
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/SaveBlueprint'}}}}
      responses:
        '201': {description: Saved, content: {application/json: {schema: {$ref: '#/components/schemas/Blueprint'}}}}
  /blueprints:
    get:
      operationId: listBlueprints
      parameters: [{$ref: '#/components/parameters/Cursor'}, {$ref: '#/components/parameters/Limit'}, {$ref: '#/components/parameters/Search'}]
      responses:
        '200': {description: Environment blueprints, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/Blueprint'}}}}}
  /blueprints/{id}:
    parameters: [{$ref: '#/components/parameters/Id'}]
    get:
      operationId: getBlueprint
      responses:
        '200': {description: Blueprint, content: {application/json: {schema: {$ref: '#/components/schemas/Blueprint'}}}}
  /blueprints/{id}/versions:
    parameters: [{$ref: '#/components/parameters/Id'}]
    get:
      operationId: listBlueprintVersions
      parameters: [{$ref: '#/components/parameters/Cursor'}, {$ref: '#/components/parameters/Limit'}]
      responses:
        '200': {description: Immutable blueprint versions, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/BlueprintVersionSummary'}}}}}
    post:
      operationId: saveBlueprintVersion
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/SaveBlueprintVersion'}}}}
      responses:
        '201': {description: Saved, content: {application/json: {schema: {$ref: '#/components/schemas/BlueprintVersion'}}}}
  /blueprint-versions/{id}:
    parameters: [{$ref: '#/components/parameters/Id'}]
    get:
      operationId: getBlueprintVersion
      responses:
        '200': {description: Blueprint version, content: {application/json: {schema: {$ref: '#/components/schemas/BlueprintVersion'}}}}
  /environments/{id}/assets/{assetId}/actions:
    parameters:
      - {$ref: '#/components/parameters/Id'}
      - {name: assetId, in: path, required: true, schema: {type: string}}
    post:
      operationId: assetAction
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ActionRequest'}}}}
      responses: {'202': {$ref: '#/components/responses/Accepted'}}
  /environments/{id}/assets/{assetId}/console:
    parameters:
      - {$ref: '#/components/parameters/Id'}
      - {name: assetId, in: path, required: true, schema: {type: string}}
    get:
      operationId: assetConsole
      description: WebSocket. Binary messages carry terminal or RFB bytes; terminal text messages contain ConsoleResize.
      parameters: [{name: kind, in: query, required: true, schema: {$ref: '#/components/schemas/ConsoleKind'}}]
      responses: {'101': {description: Connected}, '409': {description: Asset has no running instance}}
  /operations:
    get:
      operationId: listOperations
      parameters: [{name: environmentId, in: query, schema: {type: string}}, {$ref: '#/components/parameters/Cursor'}, {$ref: '#/components/parameters/Limit'}]
      responses:
        '200': {description: Operations, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/Operation'}}}}}
  /operations/{id}:
    parameters: [{$ref: '#/components/parameters/Id'}]
    get:
      operationId: getOperation
      responses:
        '200': {description: Operation, content: {application/json: {schema: {$ref: '#/components/schemas/Operation'}}}}
  /operations/{id}/retry:
    parameters: [{$ref: '#/components/parameters/Id'}]
    post:
      operationId: retryOperation
      responses: {'202': {$ref: '#/components/responses/Accepted'}}
  /templates:
    get:
      operationId: listTemplates
      parameters:
        - {$ref: '#/components/parameters/Cursor'}
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Search'}
        - {name: kind, in: query, schema: {$ref: '#/components/schemas/TemplateKind'}}
        - {name: ids, in: query, style: form, explode: false, schema: {type: array, items: {type: string}}}
      responses:
        '200': {description: Templates, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/Template'}}}}}
    post:
      operationId: createTemplate
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/Template'}}}}
      responses:
        '201': {description: Created, content: {application/json: {schema: {$ref: '#/components/schemas/Template'}}}}
  /nodes:
    get:
      operationId: listNodes
      parameters: [{$ref: '#/components/parameters/Cursor'}, {$ref: '#/components/parameters/Limit'}, {$ref: '#/components/parameters/Search'}]
      responses:
        '200': {description: Nodes, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/Node'}}}}}
    post:
      operationId: registerNode
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/NodeRegistration'}}}}
      responses:
        '201': {description: Registered, content: {application/json: {schema: {$ref: '#/components/schemas/Node'}}}}
  /identity:
    get:
      operationId: getIdentity
      responses:
        '200': {description: Identity, content: {application/json: {schema: {$ref: '#/components/schemas/Identity'}}}}
  /sessions/login:
    post:
      operationId: login
      security: []
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/Login'}}}}
      responses:
        '200': {description: Signed in, content: {application/json: {schema: {$ref: '#/components/schemas/Identity'}}}}
  /sessions/logout:
    post:
      operationId: logout
      responses: {'204': {description: Signed out}}
components:
  parameters:
    Id: {name: id, in: path, required: true, schema: {type: string}}
    Cursor: {name: cursor, in: query, schema: {type: string}}
    Limit: {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 500, default: 100}}
    Search: {name: search, in: query, schema: {type: string}}
  responses:
    Accepted:
      description: Accepted
      content: {application/json: {schema: {$ref: '#/components/schemas/Operation'}}}
  securitySchemes:
    bearer: {type: http, scheme: bearer}
  schemas:
    ConsoleKind:
      type: string
      enum: [terminal, serial, vnc]
    ConsoleResize:
      type: object
      required: [cols, rows]
      properties:
        cols: {type: integer, minimum: 1, maximum: 1000}
        rows: {type: integer, minimum: 1, maximum: 1000}
    Identity:
      type: object
      required: [id, name, administrator]
      properties:
        id: {type: string}
        name: {type: string}
        administrator: {type: boolean}
    Login:
      type: object
      required: [name, password]
      properties:
        name: {type: string}
        password: {type: string, format: password}
    Resources:
      type: object
      required: [cpu, memoryMiB, diskGiB]
      properties:
        cpu: {type: integer, minimum: 1}
        memoryMiB: {type: integer, format: int64, minimum: 64}
        diskGiB: {type: integer, format: int64, minimum: 1}
    Hardware:
      type: object
      required: [firmware, machine, diskBus, nicModel]
      properties:
        firmware: {type: string, enum: [bios, uefi]}
        machine: {type: string}
        diskBus: {type: string, enum: [ide, sata, scsi, virtio]}
        diskController: {type: string}
        nicModel: {type: string, enum: [virtio, e1000, e1000e, rtl8139, vmxnet3]}
        cpuModel: {type: string}
        secureBoot: {type: boolean}
        tpm: {type: boolean}
        guestAgent: {type: boolean}
        firmwareCode: {type: string}
        firmwareVars: {type: string}
    Volume:
      type: object
      required: [id, mountPath, sizeGiB]
      properties:
        id: {type: string}
        mountPath: {type: string}
        sizeGiB: {type: integer, format: int64}
        retain: {type: boolean}
    TemplateDisk:
      type: object
      required: [id, sizeGiB, bus, bootOrder]
      properties:
        id: {type: string}
        sizeGiB: {type: integer, format: int64, minimum: 1}
        bus: {type: string, enum: [ide, sata, scsi, virtio]}
        bootOrder: {type: integer, minimum: 1}
        controllerModel: {type: string}
        controllerIndex: {type: integer, minimum: 0}
        controllerUnit: {type: integer, minimum: 0}
    Template:
      type: object
      required: [id, name, kind, os, version, source, resources]
      properties:
        id: {type: string}
        name: {type: string}
        kind: {$ref: '#/components/schemas/TemplateKind'}
        os: {type: string}
        version: {type: integer}
        source: {type: string}
        format: {type: string, enum: [oci, docker, qcow2, raw, vmdk, ova, ovf, iso]}
        resources: {$ref: '#/components/schemas/Resources'}
        hardware: {$ref: '#/components/schemas/Hardware'}
        disks: {type: array, items: {$ref: '#/components/schemas/TemplateDisk'}}
        nicModels: {type: array, items: {type: string}}
        volumes: {type: array, items: {$ref: '#/components/schemas/Volume'}}
        state: {type: string, enum: [importing, ready, failed]}
        error: {type: string}
    Network:
      type: object
      required: [id, name, cidr]
      properties:
        id: {type: string}
        name: {type: string}
        cidr: {type: string}
        gateway: {type: string}
        dnsAssetId: {type: string}
        dnsServers: {type: array, items: {type: string}}
        mtu: {type: integer}
    Interface:
      type: object
      required: [id, networkId, mac, address, primary]
      properties:
        id: {type: string}
        networkId: {type: string}
        mac: {type: string}
        address: {type: string}
        primary: {type: boolean}
    Asset:
      type: object
      required: [id, name, templateId, resources, interfaces]
      properties:
        id: {type: string}
        name: {type: string}
        templateId: {type: string}
        resources: {$ref: '#/components/schemas/Resources'}
        interfaces: {type: array, items: {$ref: '#/components/schemas/Interface'}}
        volumes: {type: array, items: {$ref: '#/components/schemas/Volume'}}
        parameters: {type: object, additionalProperties: {type: string}}
    Route:
      type: object
      required: [networkId, destination, nextHop]
      properties:
        networkId: {type: string}
        destination: {type: string}
        nextHop: {type: string}
    Policy:
      type: object
      required: [id, networkId, direction, action]
      properties:
        id: {type: string}
        networkId: {type: string}
        direction: {type: string, enum: [ingress, egress, both]}
        action: {type: string, enum: [allow, deny, shape]}
        protocol: {type: string}
        source: {type: string}
        destination: {type: string}
        delayMs: {type: integer}
        lossPercent: {type: number}
        bandwidthKbps: {type: integer}
    EnvironmentSpec:
      type: object
      required: [assets, networks]
      properties:
        assets: {type: array, items: {$ref: '#/components/schemas/Asset'}}
        networks: {type: array, items: {$ref: '#/components/schemas/Network'}}
        routes: {type: array, items: {$ref: '#/components/schemas/Route'}}
        policies: {type: array, items: {$ref: '#/components/schemas/Policy'}}
    Point:
      type: object
      required: [x, y]
      properties:
        x: {type: number}
        y: {type: number}
    CanvasView:
      type: object
      properties:
        positions: {type: object, additionalProperties: {$ref: '#/components/schemas/Point'}}
        collapsed: {type: array, items: {type: string}}
    Draft:
      type: object
      required: [baseRevision, spec]
      properties:
        baseRevision: {type: integer}
        spec: {$ref: '#/components/schemas/EnvironmentSpec'}
    Environment:
      type: object
      required: [id, projectId, name, revision, status, spec, view, createdAt, updatedAt]
      properties:
        id: {type: string}
        projectId: {type: string}
        name: {type: string}
        externalReference: {type: string}
        blueprintVersionId: {type: string}
        revision: {type: integer}
        status: {$ref: '#/components/schemas/EnvironmentStatus'}
        spec: {$ref: '#/components/schemas/EnvironmentSpec'}
        appliedSpec: {$ref: '#/components/schemas/EnvironmentSpec'}
        view: {$ref: '#/components/schemas/CanvasView'}
        draft: {$ref: '#/components/schemas/Draft'}
        operationId: {type: string}
        error: {type: string}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    TemplateKind:
      type: string
      enum: [container, vm]
    EnvironmentStatus:
      type: string
      enum: [draft, deploying, running, stopped, suspended, changing, destroying, destroyed, failed, unknown]
    EnvironmentSummary:
      type: object
      required: [id, projectId, name, revision, status, assetCount, networkCount, createdAt, updatedAt]
      properties:
        id: {type: string}
        projectId: {type: string}
        name: {type: string}
        externalReference: {type: string}
        revision: {type: integer}
        status: {$ref: '#/components/schemas/EnvironmentStatus'}
        assetCount: {type: integer}
        networkCount: {type: integer}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    AssetState:
      type: object
      required: [assetId, instanceId, nodeId, state, observedAt]
      properties:
        assetId: {type: string}
        instanceId: {type: string}
        nodeId: {type: string}
        state: {type: string}
        error: {type: string}
        observedAt: {type: string, format: date-time}
    EnvironmentState:
      type: object
      required: [id, status, revision, assets, updatedAt]
      properties:
        id: {type: string}
        status: {type: string}
        revision: {type: integer}
        assets: {type: array, items: {$ref: '#/components/schemas/AssetState'}}
        operation: {$ref: '#/components/schemas/Operation'}
        updatedAt: {type: string, format: date-time}
    Operation:
      type: object
      required: [id, kind, state, phase, completed, total, createdAt, updatedAt]
      properties:
        id: {type: string}
        environmentId: {type: string}
        kind: {type: string}
        state: {type: string, enum: [queued, running, succeeded, failed, partially_applied]}
        phase: {type: string}
        completed: {type: integer}
        total: {type: integer}
        error: {type: string}
        results: {type: array, items: {$ref: '#/components/schemas/ExecutionResult'}}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    Node:
      type: object
      required: [id, name, endpoint, capacity, reserved, capabilities, slots, observedAt]
      properties:
        id: {type: string}
        name: {type: string}
        endpoint: {type: string}
        capacity: {$ref: '#/components/schemas/Resources'}
        reserved: {$ref: '#/components/schemas/Resources'}
        capabilities: {type: array, items: {type: string}}
        slots: {type: integer}
        observedAt: {type: string, format: date-time}
        state: {type: string}
        override: {$ref: '#/components/schemas/Resources'}
    ResolvedInterface:
      type: object
      required: [id, networkId, mac, address, prefix, primary, portName, mtu]
      properties:
        id: {type: string}
        networkId: {type: string}
        mac: {type: string}
        address: {type: string}
        prefix: {type: integer}
        primary: {type: boolean}
        portName: {type: string}
        mtu: {type: integer}
        gateway: {type: string}
        dns: {type: array, items: {type: string}}
    AssetExecution:
      type: object
      required: [asset, template, instanceId, interfaces]
      properties:
        asset: {$ref: '#/components/schemas/Asset'}
        template: {$ref: '#/components/schemas/Template'}
        instanceId: {type: string}
        previousInstanceId: {type: string}
        interfaces: {type: array, items: {$ref: '#/components/schemas/ResolvedInterface'}}
    NodePlan:
      type: object
      required: [operationId, environmentId, phase, assets, spec]
      properties:
        operationId: {type: string}
        environmentId: {type: string}
        phase: {type: string, enum: [network, policies, prepare, update, start, stop, force-stop, suspend, resume, destroy, cleanup-volumes, remove-network, inspect]}
        assets: {type: array, items: {$ref: '#/components/schemas/AssetExecution'}}
        spec: {$ref: '#/components/schemas/EnvironmentSpec'}
    ExecutionResult:
      type: object
      required: [assetId, instanceId, state, observedAt]
      properties:
        assetId: {type: string}
        instanceId: {type: string}
        state: {type: string}
        error: {type: string}
        execution: {$ref: '#/components/schemas/AssetExecution'}
        observedAt: {type: string, format: date-time}
    NodeResult:
      type: object
      required: [results]
      properties:
        results: {type: array, items: {$ref: '#/components/schemas/ExecutionResult'}}
        error: {type: string}
    NodeInfo:
      type: object
      required: [id, name, capacity, capabilities, slots]
      properties:
        id: {type: string}
        name: {type: string}
        capacity: {$ref: '#/components/schemas/Resources'}
        capabilities: {type: array, items: {type: string}}
        slots: {type: integer}
        vmHardware: {$ref: '#/components/schemas/VmHardware'}
    VmHardware:
      type: object
      required: [machines, cpuModes, cpuModels, nicModels]
      properties:
        machines: {type: array, items: {$ref: '#/components/schemas/VmMachine'}}
        cpuModes: {type: array, items: {type: string}}
        cpuModels: {type: array, items: {type: string}}
        nicModels: {type: array, items: {type: string}}
    VmMachine:
      type: object
      required: [name, aliases, maxVcpus, firmware, secureBoot, tpm2, diskBuses, firmwareFiles]
      properties:
        name: {type: string}
        aliases: {type: array, items: {type: string}}
        maxVcpus: {type: integer}
        firmware: {type: array, items: {type: string}}
        secureBoot: {type: boolean}
        tpm2: {type: boolean}
        diskBuses: {type: array, items: {type: string}}
        firmwareFiles: {type: array, items: {type: string}}
    CreateEnvironment:
      type: object
      required: [name]
      properties:
        name: {type: string}
        projectId: {type: string}
        externalReference: {type: string}
        blueprintVersionId: {type: string}
        clientRequestId: {type: string}
        run: {type: boolean}
        spec: {$ref: '#/components/schemas/EnvironmentSpec'}
    SaveBlueprint:
      type: object
      required: [name, expectedRevision, spec]
      properties:
        name: {type: string}
        expectedRevision: {type: integer, minimum: 0}
        spec: {$ref: '#/components/schemas/EnvironmentSpec'}
    SaveBlueprintVersion:
      type: object
      required: [environmentId, expectedRevision, spec]
      properties:
        environmentId: {type: string}
        expectedRevision: {type: integer, minimum: 0}
        spec: {$ref: '#/components/schemas/EnvironmentSpec'}
    Blueprint:
      type: object
      required: [id, projectId, name, latestVersionId, latestVersion, assetCount, networkCount, createdAt, updatedAt]
      properties:
        id: {type: string}
        projectId: {type: string}
        name: {type: string}
        latestVersionId: {type: string}
        latestVersion: {type: integer}
        assetCount: {type: integer}
        networkCount: {type: integer}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    BlueprintVersionSummary:
      type: object
      required: [id, blueprintId, version, assetCount, networkCount, createdAt]
      properties:
        id: {type: string}
        blueprintId: {type: string}
        version: {type: integer}
        assetCount: {type: integer}
        networkCount: {type: integer}
        createdAt: {type: string, format: date-time}
    BlueprintVersion:
      allOf:
        - {$ref: '#/components/schemas/BlueprintVersionSummary'}
        - type: object
          required: [spec, view, sourceEnvironmentId, sourceRevision]
          properties:
            spec: {$ref: '#/components/schemas/EnvironmentSpec'}
            view: {$ref: '#/components/schemas/CanvasView'}
            sourceEnvironmentId: {type: string}
            sourceRevision: {type: integer}
    ActionRequest:
      type: object
      required: [action]
      properties:
        action: {type: string, enum: [start, stop, force-stop, reboot, suspend, resume, rebuild, destroy]}
        expectedRevision: {type: integer}
        clientRequestId: {type: string}
    ChangeRequest:
      type: object
      required: [expectedRevision, spec, apply]
      properties:
        expectedRevision: {type: integer}
        spec: {$ref: '#/components/schemas/EnvironmentSpec'}
        apply: {type: boolean}
        clientRequestId: {type: string}
    ChangeItem:
      type: object
      required: [id, name, kind, effect]
      properties:
        id: {type: string}
        name: {type: string}
        kind: {type: string, enum: [asset, network]}
        effect: {type: string, enum: [add, update, replace, remove]}
        requiresStop: {type: boolean}
        dataEffect: {type: string}
    ChangePreview:
      type: object
      required: [revision, changes]
      properties:
        revision: {type: integer}
        changes: {type: array, items: {$ref: '#/components/schemas/ChangeItem'}}
    NodeRegistration:
      type: object
      required: [name, endpoint]
      properties:
        name: {type: string}
        endpoint: {type: string}
    Problem:
      type: object
      required: [status, title, detail]
      properties:
        status: {type: integer}
        title: {type: string}
        detail: {type: string}
