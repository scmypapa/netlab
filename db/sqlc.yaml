version: '2'
sql:
  - engine: postgresql
    queries: [queries.sql, blueprints.sql, access.sql, observation.sql, services.sql, vpn.sql, external.sql, storage.sql, volumes.sql, recovery.sql, backups.sql, guest.sql]
    schema: migrations
    gen:
      go:
        package: queries
        out: queries
        sql_package: pgx/v5
        emit_empty_slices: true
        emit_pointers_for_null_types: true
        overrides:
          - db_type: pg_catalog.timestamptz
            go_type: {import: time, type: Time}
