name: Build and Release
on:
  push:
    branches: ['main', 'codex/**']
    tags: ['v*']
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: netlab-ci
          POSTGRES_DB: netlab
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      NETLAB_DATABASE_URL: postgres://postgres:netlab-ci@localhost:5432/netlab?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libvirt-dev openvswitch-switch ovn-central suricata suricata-update
          sudo suricata-update --no-test --no-reload
      - name: Verify resource, networking and execution changes
        run: |
          go test ./internal/security ./internal/metrics ./internal/capture ./internal/network ./internal/observation ./internal/server ./internal/update -count=1
          go test -tags libvirt_dlopen ./internal/engine -run 'TestParallelTemplatePreparationAndTrim|TestColdTemplateSourceDoesNotOccupyComputeSlot|TestMetricsRetainHostWhenContainerdUnavailable' -count=1
          NETLAB_REAL_NETWORK=1 go test ./internal/network -run TestRealOVNMutualTLS -count=1
          go test -race -c -o "$RUNNER_TEMP/netlab-capture.test" ./internal/capture
          sudo env NETLAB_REAL_CAPTURE=1 "$RUNNER_TEMP/netlab-capture.test" -test.run TestRealContinuousOVSSampling -test.v -test.timeout=60s
          go test -race -c -o "$RUNNER_TEMP/netlab-security.test" ./internal/security
          sudo env NETLAB_REAL_SECURITY=1 "$RUNNER_TEMP/netlab-security.test" -test.run 'TestRealSuricata|TestEVEReader' -test.v -test.timeout=120s
          go build -trimpath ./cmd/controller
          go build -trimpath -tags libvirt_dlopen ./cmd/node
  package:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Build web
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm build
      - name: Build package
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          [[ "$VERSION" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          sudo apt-get update
          sudo apt-get install -y libvirt-dev autoconf automake libtool pkg-config libcairo2-dev libjpeg-turbo8-dev libpng-dev libpango1.0-dev libwebp-dev freerdp3-dev libssl-dev
          mkdir -p package/web package/deploy package/scripts
          flags="-s -w -X netlab.local/core/internal/buildinfo.Version=$VERSION -X netlab.local/core/internal/buildinfo.Commit=$GITHUB_SHA"
          go test ./internal/update -count=1
          go build -trimpath -ldflags "$flags" -o package/netlab-controller ./cmd/controller
          go build -trimpath -tags libvirt_dlopen -ldflags "$flags" -o package/netlab-node ./cmd/node
          cp -a web/dist/. package/web/
          cp -a deploy/systemd deploy/sudoers package/deploy/
          cp scripts/install-{common,controller,node,storage,security}.sh scripts/issue-node-certificate.sh package/scripts/
          bash scripts/build-guacd.sh "$RUNNER_TEMP/guacamole-source" "$PWD/package/guacamole"
          curl -fL https://github.com/VictoriaMetrics/VictoriaMetrics/releases/download/v1.126.0/victoria-metrics-linux-amd64-v1.126.0.tar.gz | tar -xz -C package victoria-metrics-prod
          curl -fL https://github.com/restic/restic/releases/download/v0.18.1/restic_0.18.1_linux_amd64.bz2 | bunzip2 > package/restic
          chmod 0755 package/restic
          jq -n --arg version "$VERSION" '{version:$version,os:"linux",arch:"amd64"}' > package/release.json
          tar --dereference --hard-dereference -C package -czf netlab_linux_amd64.tar.gz .
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
        run: gh release create "$VERSION" netlab_linux_amd64.tar.gz --verify-tag --notes-file .github/release-notes.md --title "Netlab $VERSION" --latest
