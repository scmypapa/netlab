name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Build web
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm build
      - name: Build package
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          [[ "$VERSION" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          sudo apt-get update
          sudo apt-get install -y libvirt-dev
          mkdir -p package/web package/deploy package/scripts
          flags="-s -w -X netlab.local/core/internal/buildinfo.Version=$VERSION -X netlab.local/core/internal/buildinfo.Commit=$GITHUB_SHA"
          go test ./internal/update -count=1
          go build -trimpath -ldflags "$flags" -o package/netlab-controller ./cmd/controller
          go build -trimpath -tags libvirt_dlopen -ldflags "$flags" -o package/netlab-node ./cmd/node
          cp -a web/dist/. package/web/
          cp -a deploy/systemd deploy/sudoers package/deploy/
          cp scripts/install-controller.sh package/scripts/
          jq -n --arg version "$VERSION" '{version:$version,os:"linux",arch:"amd64"}' > package/release.json
          tar -C package -czf netlab_linux_amd64.tar.gz .
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
        run: gh release create "$VERSION" netlab_linux_amd64.tar.gz --verify-tag --generate-notes --title "Netlab $VERSION" --latest
